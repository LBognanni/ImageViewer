name: Build

on:
  push:
    branches: [master]

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}

    steps:
    - name: "Checkout Code"
      uses: actions/checkout@v4
      with:
        fetch-depth: '0'

    - name: Bump version and push tag
      id: tag
      uses: anothrNick/github-tag-action@1.38.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        WITH_V: false
        #DRY_RUN: true

  # Native AOT can't cross-compile between operating systems, so each one builds on its own runner
  build:
    needs: tag
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: windows-latest, runtime: win-x64 }
          - { os: ubuntu-latest, runtime: linux-x64 }
          - { os: macos-latest, runtime: osx-arm64 }
          - { os: macos-latest, runtime: osx-x64 }
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.tag.outputs.new_tag }}

    steps:
    - name: "Checkout Code"
      uses: actions/checkout@v4

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Install Native AOT prerequisites
      if: runner.os == 'Linux'
      run: |
        sudo apt-get -y update
        sudo apt-get -y install clang zlib1g-dev libglib2.0-bin

    - name: Run tests
      run: dotnet test ImageViewer.Tests

    - name: Publish
      run: dotnet run --project build/_build.csproj -- --target Publish --runtime ${{ matrix.runtime }}

    - name: Build Windows installer
      if: runner.os == 'Windows'
      run: |
        choco install nsis -y --no-progress
        & "C:\Program Files (x86)\NSIS\makensis.exe" /DVERSION=$env:VERSION .\Setup\ImageViewer_setup.nsi
        New-Item -ItemType Directory -Force dist
        Move-Item Setup\ImageViewer_Setup.exe dist\

    - name: Build Linux package
      if: runner.os == 'Linux'
      run: bash Setup/package-linux.sh "${{ matrix.runtime }}" "$VERSION"

    - name: Build macOS package
      if: runner.os == 'macOS'
      run: bash Setup/package-macos.sh "${{ matrix.runtime }}" "$VERSION"

    - uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.runtime }}
        path: dist/*
        if-no-files-found: error

  release:
    needs: [tag, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/download-artifact@v4
      with:
        path: dist
        merge-multiple: true

    - uses: ncipollo/release-action@v1
      with:
        allowUpdates: true
        tag: "${{ needs.tag.outputs.new_tag }}"
        artifacts: "dist/*"
        token: ${{ secrets.GITHUB_TOKEN }}
