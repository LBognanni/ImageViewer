name: Build and release

# Every run tests and packages all platforms. Pushing a version tag also drafts a release.
on:
  pull_request:
  push:
    branches: [master]
    tags: ['[0-9]+.[0-9]+.[0-9]+', '[0-9]+.[0-9]+.[0-9]+-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Native AOT can't cross-compile between operating systems, so each one builds on its own runner
  build:
    name: ${{ matrix.runtime }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, runtime: win-x64 }
          # The oldest supported Ubuntu, because the binary needs this glibc or newer
          - { os: ubuntu-22.04, runtime: linux-x64 }
          - { os: macos-15, runtime: osx-arm64 }
          - { os: macos-15-intel, runtime: osx-x64 }
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0' }}

    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Install Native AOT prerequisites
      if: runner.os == 'Linux'
      run: |
        sudo apt-get -y update
        sudo apt-get -y install clang zlib1g-dev libglib2.0-bin

    - name: Run tests
      run: dotnet test ImageViewer.Tests

    - name: Publish
      run: dotnet publish ImageViewer -c Release -r ${{ matrix.runtime }} -p:Version=${{ env.VERSION }} -o output

    - name: Build Windows installer
      if: runner.os == 'Windows'
      run: |
        choco install nsis -y --no-progress
        & "C:\Program Files (x86)\NSIS\makensis.exe" /DVERSION=$env:VERSION .\Setup\ImageViewer_setup.nsi
        New-Item -ItemType Directory -Force dist
        Move-Item Setup\ImageViewer_Setup.exe dist\

    - name: Build Linux package
      if: runner.os == 'Linux'
      run: bash Setup/package-linux.sh "${{ matrix.runtime }}" "$VERSION"

    - name: Build macOS package
      if: runner.os == 'macOS'
      run: bash Setup/package-macos.sh "${{ matrix.runtime }}" "$VERSION"

    - uses: actions/upload-artifact@v6
      with:
        name: ${{ matrix.runtime }}
        path: dist/*
        if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - uses: actions/download-artifact@v7
      with:
        path: dist
        merge-multiple: true

    - name: Draft the release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: gh release create "$GITHUB_REF_NAME" dist/* --draft --generate-notes ${{ contains(github.ref_name, '-') && '--prerelease' || '' }}
